<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điền thông tin còn thiếu · Đăng ký hộ kinh doanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-seal" aria-hidden="true">★</span>
      <div class="brand-text">
        <p class="brand-eyebrow">Phòng đăng ký kinh doanh</p>
        <h1 class="brand-title">Điền thông tin còn thiếu</h1>
      </div>
    </div>
    <p class="topbar-note">Chọn hồ sơ, điền vào chỗ trống, đóng dấu in giấy.</p>
  </header>

  <main class="desk">
    <aside class="rail">
      <div class="rail-head">
        <h2>Hồ sơ</h2>
        <span class="rail-count" id="railCount">–</span>
      </div>
      <button type="button" class="rail-add" id="btnNewProfile">+ Thêm hồ sơ</button>
      <ul class="file-list" id="fileList" aria-label="Danh sách hồ sơ"></ul>
    </aside>

    <section class="sheet" id="sheet" aria-live="polite">
      <p class="loading">Đang mở hồ sơ…</p>
    </section>
  </main>

  <dialog class="modal" id="newProfileModal">
    <form method="dialog" id="newProfileForm" class="modal-card">
      <h3>Thêm hồ sơ trống</h3>
      <p class="modal-hint">Nhập họ tên và/hoặc tên HKD — hệ thống tạo thư mục slug và mở form trống.</p>
      <label class="field-label" for="newHoTen">Họ và tên</label>
      <input id="newHoTen" name="hoTen" type="text" autocomplete="name">
      <label class="field-label" for="newTenHKD">Tên hộ kinh doanh</label>
      <input id="newTenHKD" name="tenHKD" type="text" autocomplete="organization">
      <p class="modal-error" id="newProfileError" hidden></p>
      <div class="modal-actions">
        <button type="submit" value="cancel" class="btn-ghost">Hủy</button>
        <button type="submit" value="create" class="btn-primary" id="btnCreateProfile">Tạo hồ sơ</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
